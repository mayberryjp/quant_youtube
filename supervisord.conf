[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
loglevel=info

[program:allin-migrate]
command=/bin/bash -lc "set -euo pipefail; python3 -m app.services.migrate_bootstrap; touch /tmp/allin-migrations.done"
directory=/app
autostart=true
autorestart=false
startsecs=0
priority=1
environment=PYTHONUNBUFFERED="1"

[program:allin-api]
command=/bin/bash -lc "while [ ! -f /tmp/allin-migrations.done ]; do sleep 1; done; exec python3 -m app.main"
directory=/app
autostart=true
autorestart=true
startretries=999
startsecs=5
priority=10
environment=PYTHONUNBUFFERED="1"

[program:allin-ingest-worker]
command=/bin/bash -lc "while [ ! -f /tmp/allin-migrations.done ]; do sleep 1; done; exec python3 -m app.services.ingest_worker"
directory=/app
autostart=true
autorestart=true
startretries=999
startsecs=5
priority=20
environment=PYTHONUNBUFFERED="1"
