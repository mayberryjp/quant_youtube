[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
loglevel=info

[program:alembic-migrate]
command=alembic upgrade head
directory=/app
autostart=true
autorestart=false
startsecs=0
exitcodes=0
priority=10
environment=PYTHONUNBUFFERED="1"

[program:allin-api]
command=bash -c "sleep 5 && exec python3 -m app.main"
directory=/app
autostart=true
autorestart=true
startretries=999
startsecs=5
priority=20
environment=PYTHONUNBUFFERED="1"

[program:allin-ingest-worker]
command=bash -c "sleep 5 && exec python3 -m app.services.ingest_worker --wake-time %(ENV_INGEST_WAKE_TIME)s"
directory=/app
autostart=true
autorestart=true
startretries=999
startsecs=5
priority=30
environment=PYTHONUNBUFFERED="1"
