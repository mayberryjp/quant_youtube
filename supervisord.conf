[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
loglevel=info

[program:allin-api]
command=python3 -m app.main
directory=/app
autostart=true
autorestart=true
startretries=999
startsecs=5
priority=10
environment=PYTHONUNBUFFERED="1"

[program:allin-ingest-worker]
command=python3 -m app.services.ingest_worker
directory=/app
autostart=true
autorestart=true
startretries=999
startsecs=5
priority=20
environment=PYTHONUNBUFFERED="1"
