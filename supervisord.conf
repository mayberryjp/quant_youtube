[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
loglevel=info
user=root

[program:allin-migrate]
command=python3 -m app.services.migrate_bootstrap
directory=/app
autostart=true
autorestart=false
startsecs=0
priority=1
environment=PYTHONUNBUFFERED="1"
stopasgroup=true
killasgroup=true

[program:allin-api]
command=python3 -m app.services.run_after_migrations app.main
directory=/app
autostart=true
autorestart=true
startretries=999
startsecs=5
priority=10
environment=PYTHONUNBUFFERED="1"
stopasgroup=true
killasgroup=true

[program:allin-ingest-worker]
command=python3 -m app.services.run_after_migrations app.services.ingest_worker
directory=/app
autostart=true
autorestart=true
startretries=999
startsecs=5
priority=20
environment=PYTHONUNBUFFERED="1"
stopasgroup=true
killasgroup=true
