[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
loglevel=info

[program:alembic-migrate]
command=bash -c "until alembic upgrade head; do echo 'alembic retry in 2s'; sleep 2; done; touch /tmp/alembic.done"
directory=/app
autostart=true
autorestart=false
startsecs=0
exitcodes=0
priority=10
environment=PYTHONUNBUFFERED="1"

[program:allin-api]
command=bash -c "until test -f /tmp/alembic.done; do echo 'api waiting for migration gate'; sleep 2; done; exec python3 -m app.main"
directory=/app
autostart=true
autorestart=true
startretries=999
startsecs=5
priority=20
environment=PYTHONUNBUFFERED="1"

[program:allin-ingest-worker]
command=bash -c "until test -f /tmp/alembic.done; do echo 'worker waiting for migration gate'; sleep 2; done; exec python3 -m app.services.ingest_worker"
directory=/app
autostart=true
autorestart=true
startretries=999
startsecs=5
priority=30
environment=PYTHONUNBUFFERED="1"
