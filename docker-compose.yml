services:
  app:
    container_name: quant_allinpodcast
    build: .
    restart: "unless-stopped"
    environment:
      - TZ=${TZ:-UTC}
      - API_LISTEN_ADDRESS=${API_LISTEN_ADDRESS:-0.0.0.0}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must point to an external database}
      - API_PORT=${API_PORT:-8022}
      - INGEST_WAKE_TIME=${INGEST_WAKE_TIME:-06:00}
      - LOOKBACK_DAYS=${LOOKBACK_DAYS:-14}
      - MAX_ATTEMPTS=${MAX_ATTEMPTS:-5}
      - MIN_VIDEO_DURATION_SECONDS=${MIN_VIDEO_DURATION_SECONDS:-600}
      - FAILED_RETRY_DELETE_ATTEMPTS=${FAILED_RETRY_DELETE_ATTEMPTS:-10}
      - CHANNEL_SLUG=${CHANNEL_SLUG:-allin}
      - YOUTUBE_CHANNEL_ID=${YOUTUBE_CHANNEL_ID:-}
      - YOUTUBE_CHANNEL_HANDLE=${YOUTUBE_CHANNEL_HANDLE:-allin}
      - YOUTUBE_CHANNELS=${YOUTUBE_CHANNELS:-allin}
      - TRANSCRIPT_LANGUAGES=${TRANSCRIPT_LANGUAGES:-en,asr}
      - TRANSCRIPTAPI_KEY=${TRANSCRIPTAPI_KEY:-}
      - TRANSCRIPTAPI_BASE_URL=${TRANSCRIPTAPI_BASE_URL:-https://transcriptapi.com/api/v2}
      - TRANSCRIPTAPI_TIMEOUT=${TRANSCRIPTAPI_TIMEOUT:-120}
      - DISTILL_API_URL=${DISTILL_API_URL:-http://quant-distill:8021}
      - DISTILL_API_TIMEOUT=${DISTILL_API_TIMEOUT:-180}
      - DISTILL_SOURCE=${DISTILL_SOURCE:-quant_allinpodcast}
      - DISTILL_MAX_CHUNK_CHARS=${DISTILL_MAX_CHUNK_CHARS:-12000}
      - HTTP_RETRIES=${HTTP_RETRIES:-3}
      - RETRY_BACKOFF=${RETRY_BACKOFF:-1.0}
      - MAX_PAGE_SIZE=${MAX_PAGE_SIZE:-100}
      - DEFAULT_PAGE_SIZE=${DEFAULT_PAGE_SIZE:-25}
    ports:
      - "8022:8022"
