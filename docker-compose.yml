services:
  db:
    container_name: quant_allinpodcast_db
    image: postgres:16
    restart: "unless-stopped"
    environment:
      POSTGRES_DB: quant
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant_dev_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quant"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - quant_allinpodcast_pgdata:/var/lib/postgresql/data

  app:
    container_name: quant_allinpodcast
    build: .
    restart: "unless-stopped"
    env_file:
      - .env
    environment:
      - TZ=${TZ:-UTC}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://quant:quant_dev_password@db:5432/quant}
      - API_PORT=${API_PORT:-8022}
      - INGEST_WAKE_TIME=${INGEST_WAKE_TIME:-06:00}
      - INGEST_INTERVAL_HOURS=${INGEST_INTERVAL_HOURS:-4}
      - YOUTUBE_CHANNELS=${YOUTUBE_CHANNELS:-allin}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://ollama:11434/v1}
      - LLM_MODEL=${LLM_MODEL:-llama3.1:8b}
      - SENTIMENT_API_URL=${SENTIMENT_API_URL:-}
      - WATCHLIST_API_URL=${WATCHLIST_API_URL:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8022:8022"

  ollama:
    container_name: quant_allinpodcast_ollama
    image: ollama/ollama:latest
    restart: "unless-stopped"
    ports:
      - "11434:11434"
    volumes:
      - quant_allinpodcast_ollama:/root/.ollama

volumes:
  quant_allinpodcast_pgdata:
  quant_allinpodcast_ollama:
